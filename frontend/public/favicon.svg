<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0A0E27"/>
      <stop offset="100%" stop-color="#050816"/>
    </radialGradient>

    <!-- Neon Cyan-Purple Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#7B61FF"/>
      <stop offset="100%" stop-color="#00FF88"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGlow)" stroke="url(#neonGrad)" stroke-width="8"/>

  <!-- Outer Hexagon / Shield Frame -->
  <polygon points="256,48 432,136 432,376 256,464 80,376 80,136" 
           fill="none" stroke="url(#neonGrad)" stroke-width="10" filter="url(#neonGlowFilter)" opacity="0.9"/>

  <!-- Inner Cyber Core Shapes -->
  <polygon points="256,96 384,160 384,352 256,416 128,352 128,160" 
           fill="rgba(0, 229, 255, 0.05)" stroke="url(#accentGrad)" stroke-width="4"/>

  <!-- StegX Cube / Binary Matrix Symbol -->
  <g transform="translate(156, 156)">
    <!-- Top Face -->
    <polygon points="100,20 180,60 100,100 20,60" fill="url(#neonGrad)" opacity="0.8"/>
    <!-- Left Face -->
    <polygon points="20,60 100,100 100,180 20,140" fill="#7B61FF" opacity="0.6"/>
    <!-- Right Face -->
    <polygon points="100,100 180,60 180,140 100,180" fill="#00E5FF" opacity="0.7"/>

    <!-- Central Lock Pulse -->
    <circle cx="100" cy="100" r="16" fill="#00FF88" filter="url(#neonGlowFilter)"/>
  </g>
</svg>
